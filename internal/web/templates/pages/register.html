{{ define "content" }}
<div class="mx-auto max-w-sm">
  <h1 class="text-xl font-semibold tracking-tight">Create an account</h1>

  <form method="post" action="/register" class="mt-6 space-y-4">
    {{ template "csrf" . }}

    <div>
      <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
      <input id="email" name="email" type="email" required autofocus autocomplete="email"
             value="{{ with .Form }}{{ .Email }}{{ end }}"
             class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 shadow-sm focus:border-slate-500 focus:ring-slate-500">
      {{ template "fieldError" (index .Errors "email") }}
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
      <input id="password" name="password" type="password" required autocomplete="new-password" minlength="8"
             class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 shadow-sm focus:border-slate-500 focus:ring-slate-500">
      <p class="mt-1 text-xs text-slate-500">At least 8 characters. Length is what matters; nothing else is required.</p>
      {{ template "fieldError" (index .Errors "password") }}
    </div>

    <button type="submit"
            class="w-full rounded-md bg-slate-900 px-4 py-2 font-medium text-white hover:bg-slate-700">
      Create account
    </button>
  </form>

  <p class="mt-6 text-sm text-slate-600">
    Already registered? <a href="/login" class="font-medium text-slate-900 underline">Log in</a>.
  </p>
</div>
{{ end }}
