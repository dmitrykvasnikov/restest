# Local and single-host deployment. `docker compose up` brings up Postgres and
# the application, which migrates the database itself on startup.
#
# Settings come from a .env file next to this one; see .env.example.

name: restest

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-restest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restest}
      POSTGRES_DB: ${POSTGRES_DB:-restest}
    ports:
      # Loopback only. The port is published so that `make run` and psql can
      # reach the database from the host, not so that the network can.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The application waits for this rather than for the container to exist:
      # Postgres accepts connections only well after the process starts.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restest} -d ${POSTGRES_DB:-restest}"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        # `make up` fills this in from git; a bare `docker compose build` leaves
        # the binary reporting an unknown revision.
        REVISION: ${RESTEST_REVISION:-}
    depends_on:
      db:
        condition: service_healthy
    environment:
      RESTEST_DATABASE_URL: postgres://${POSTGRES_USER:-restest}:${POSTGRES_PASSWORD:-restest}@db:5432/${POSTGRES_DB:-restest}?sslmode=disable
      RESTEST_HTTP_ADDR: ":8080"
      # How the outside world reaches this instance. The UI shows it as the
      # root of every mock URL, and its scheme decides whether cookies are
      # marked Secure — so a deployment behind TLS must set it to its https
      # address or logging in will not work.
      RESTEST_BASE_URL: ${RESTEST_BASE_URL:-http://localhost:8080}
      RESTEST_LOG_LEVEL: ${RESTEST_LOG_LEVEL:-info}
      RESTEST_LOG_FORMAT: ${RESTEST_LOG_FORMAT:-json}
      # The request log. Defaults are the application's own; passed through so
      # that an instance keeping more or less of it does not need a rebuild.
      RESTEST_LOG_BODY_LIMIT: ${RESTEST_LOG_BODY_LIMIT:-65536}
      RESTEST_LOG_BUFFER: ${RESTEST_LOG_BUFFER:-1000}
      RESTEST_LOG_RETENTION_MONTHS: ${RESTEST_LOG_RETENTION_MONTHS:-3}
      # The shared demo project at /m/demo/, provisioned at startup and
      # restored to its seeds on this interval. Set DEMO_ENABLED to false on an
      # instance that should serve nothing to visitors without an account.
      RESTEST_DEMO_ENABLED: ${RESTEST_DEMO_ENABLED:-true}
      RESTEST_DEMO_RESET_INTERVAL: ${RESTEST_DEMO_RESET_INTERVAL:-1h}
      # Rate limits, in requests per second per key; zero turns one off.
      RESTEST_RATE_LIMIT_IP: ${RESTEST_RATE_LIMIT_IP:-50}
      RESTEST_RATE_LIMIT_PROJECT: ${RESTEST_RATE_LIMIT_PROJECT:-200}
      RESTEST_RATE_LIMIT_API: ${RESTEST_RATE_LIMIT_API:-20}
      # Whose X-Forwarded-For to believe. Empty by default, which means the
      # header is never read: an instance published straight from compose is
      # reached directly, and a proxy in front of one is something the operator
      # knows about and names here.
      RESTEST_TRUSTED_PROXIES: ${RESTEST_TRUSTED_PROXIES:-}
      # Caps on one request, and the server's own timeouts.
      RESTEST_MAX_REQUEST_BODY: ${RESTEST_MAX_REQUEST_BODY:-1048576}
      RESTEST_MAX_HEADER_BYTES: ${RESTEST_MAX_HEADER_BYTES:-65536}
      RESTEST_READ_HEADER_TIMEOUT: ${RESTEST_READ_HEADER_TIMEOUT:-10s}
      RESTEST_READ_TIMEOUT: ${RESTEST_READ_TIMEOUT:-30s}
      RESTEST_WRITE_TIMEOUT: ${RESTEST_WRITE_TIMEOUT:-30s}
      RESTEST_IDLE_TIMEOUT: ${RESTEST_IDLE_TIMEOUT:-120s}
      # The Prometheus exposition. The port is published on loopback by
      # default, so /metrics is not reachable from the network unless
      # RESTEST_BIND says otherwise — at which point set a token.
      RESTEST_METRICS_ENABLED: ${RESTEST_METRICS_ENABLED:-true}
      RESTEST_METRICS_TOKEN: ${RESTEST_METRICS_TOKEN:-}
    ports:
      # Loopback by default: until M1 there is no authentication at all, and
      # even after it there is no reason to put a development instance on the
      # network by accident. Set RESTEST_BIND=0.0.0.0 to expose it deliberately.
      - "${RESTEST_BIND:-127.0.0.1}:${RESTEST_PORT:-8080}:8080"
    # SIGTERM starts the graceful shutdown; give it more than the default ten
    # seconds so in-flight requests finish on their own.
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
